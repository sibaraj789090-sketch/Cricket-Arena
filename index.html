    <script>
      // Gracefully handle/ignore Vite HMR WebSocket connection events in Cloud Run preview iframe
      window.addEventListener('error', function(event) {
        var msg = (event.message || '') + ' ' + (event.error ? event.error.message : '');
        if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var msg = String(event.reason && event.reason.message ? event.reason.message : event.reason || '');
        if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
